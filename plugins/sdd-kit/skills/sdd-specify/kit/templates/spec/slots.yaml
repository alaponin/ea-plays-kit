    closes_with: ""

# The seven support folders, carried over unchanged from version 1.0.
support:

  - dir: _conformance
    title: The rule-by-rule conformance claims
    body: |
      One file per document produced here, naming every rule of its governing standard and
      the verdict against it.

      **A claim of conformance is made rule by rule, or it is not a claim; it is an
      opinion.** `SDD-01` §14.

      A finding that has an owner does not defeat a claim. **A failure that was never
      recorded does.**

  - dir: _amendments
    title: Where the standards get amended from use
    body: |
      **This is what a run is actually for.** Every place a standard could not be followed,
      was ambiguous, cost more than it was worth, or turned out to be silent — recorded
      **with the moment it happened**, from the first sitting onward and never as a closing
      step.

      An amendment is drafted here and proposed into the standards folder's `_proposals/`.
      **Nothing here binds anything**, and no standard is ever edited from this folder.

  - dir: _findings
    title: Findings, each with an owner
    body: |
      A gap is a finding with an owner, never a local invention. `SDD-01` §14.

      A finding that has an owner does not defeat the work. **A failure that nobody wrote
      down does.**

  - dir: _rulings
    title: What the owner was asked, what he was offered, what he decided
    body: |
      One file per ruling. A decision that has been taken is cited, never argued again. A
      decision that is genuinely open is flagged, never quietly answered.

      Where two signed documents contradict each other, that is a decision for a person,
      not a defect to be tidied away.

  - dir: _sessions
    title: Commissions and their closing reports
    body: |
      One commission per piece of work, one report per commission, and one dated folder of
      working files per session.

  - dir: _machinery
    title: The plans, the renderers, the checks and the gate
    body: |
      Every page a person reads here is generated from a record and never typed. A
      renderer's `--check` refuses a page that differs from what its record renders now.

  - dir: _reviews
    title: Generated pages written for a person to read
    body: |
      Plain English, no jargon, no internals, no history. Every figure on a page is
      obtained by a command that is printed on it.

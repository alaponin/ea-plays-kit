# templates/spec/slots.yaml — the twelve things a specification is made of, and the
# sixteen points at which one of them is handed to the next. How many of each there are is
# stated once, under `counts:` below, and read from there by every program that reads this file.
#
# THE SINGLE PLACE EACH FACT LIVES. `kit spec new` renders every folder and every README
# of a specification tree from this file and from nothing else. A correction to what a slot
# is, who writes it, what governs it or when it is written goes HERE, and the tree is
# scaffolded again.
#
# WHAT VERSION 2.0 ADDS. Version 1.0 carried one prose sentence per slot saying what
# governed it. This edition carries, for each of the eleven, the four things that have to be
# known before the thing can be written: where the standard is, where it is written how to
# prepare the thing, how the seams with what comes before and after are made, and how the
# result is checked. Those are the `standard`, `preparation`, `seams` and `check` fields.
# Beside them stands `cadence`, which says whether the thing is settled once for the whole
# system, walked again for every goal, run alongside the whole of it, or produced by nobody.
# A new top-level `handovers:` section carries the fourteen crossings of the method
# standard's figure 6.
#
# WHAT VERSION 2.1 ADDS (25 September 2026, METHOD-2026-09-25-12). The twelfth thing, the
# interaction design, as slot 08a — numbered after the walk-through it follows so that no slot is
# renumbered (rulings/2026-08-31-the-renumbering.yaml) — and the two handovers SDD-01 v3.3 adds
# with it, 15 and 16, numbered after the last. And one new entry, `counts:`: how many things and
# how many handovers the register holds. `tools/slot.py` refused any register without eleven rows
# and fourteen handovers, a count written into its code; it now reads the counts here, so that a
# new thing is a change to this file and to nothing else.
#
# WHAT IS TYPED AND WHAT IS RESOLVED. Every cell that names a document, an edition, a
# section, a rule range, a path or a program is typed here and RESOLVED BY A PROGRAM against
# the two roots — `tools/slot.py`, reached as `kit slot --check`. Four cells are derived
# rather than authored: the edition, the standing and the rule range, which every standard
# states on its own first page and in its own rule table, and the one-line `governs`
# rendering that the scaffold prints. The program refuses a row whose typed value differs
# from the document's. A cell whose knowledge does not exist carries the `absent` form with
# the reason and an owner, and the program reports it on every use; it is never filled
# locally.
#
# THE TWO ROOTS. Paths under `standard.file` are relative to the standards root; paths under
# `check.program`, `preparation.template` and the `kit:` form of `how` are relative to the
# kit root. The project's constants file names both, and the resolving program takes them as
# arguments, so that no path of one machine is written here.
#
# INVARIANT 1 — this file carries no domain literal. No system name, no sector word, no
# project. A slot description that only makes sense for one kind of system has leaked
# testbed into product.

# WHAT THE EDITION OF 28 SEPTEMBER 2026 ADDS (METHOD-2026-09-28-10). Three cells, all pointers.
# `check.checklist` names the checklist the standard's build emits as its last step, under
# templates/spec/checklists/, with the standard's edition and the checksum of its document in the
# head; `kit slot --check` reports a checklist whose head no longer names the document standing in
# the root. `preparation.template` names a template of the thing itself, emitted by the same build
# under templates/spec/artefacts/, and never the scaffold's readme for the slot; `preparation.beside`
# names the templates written beside it where the standard has one person write more than one
# document (row 02). `skill` names the skill that helps a person build the thing, as plugin:skill;
# a row for which the method has no skill reads absent, with its reason and its owner. The
# checklists and the templates are copies of what the builds emit and are never edited here; the
# builds are the five the estate's REGISTER_what_builds_what.md names, each ending by calling
# _working/2026-09-28_the_checklists/emit_checklist.js. The format stays 2.1: no cell of 2.1 changed
# its meaning, and `kit slot --check` holds the new cells.

# WHAT THE EDITION OF 29 SEPTEMBER 2026 CHANGES (METHOD-2026-09-29-04). No cell changes its
# meaning and the format stays 2.1. Four standards stand in new editions — SDD-02 v0.3, SDD-03
# v0.6, SDD-06 v1.2 and SDD-07 v1.3 — and the rows citing them name those editions. Three
# crossings whose act no standard stated now point where a standard states it: handover 2 at
# SDD-03 §5, handover 9 at SDD-07 §15, and handover 11, with the seam from the entity model to
# the application model, at the tables of SDD-06 §13 and SDD-07 §16. The walk-through's
# preparation cell points at SDD-07 §15 in place of its reason for reading absent.

# WHAT THE EDITION OF 29 SEPTEMBER 2026 CHANGES, SECOND (METHOD-2026-09-29-18). No cell changes its
# meaning and the format stays 2.1. `sourced_from` names SDD-01 v3.4 of 29 September 2026, whose
# section 4 adds a table of the folder each of the twelve things lives in, as the rows below render
# it, and says that each standard's build produces its checklist and the template of each thing it
# has a person write. Row 06 names its driver where the round of the application model moved it,
# into the method's plugin (the review METHOD-2026-09-29-17, section 8, item 1).

# WHAT THE EDITION OF 29 SEPTEMBER 2026 CHANGES, THIRD (METHOD-2026-09-29-24). No cell changes its
# meaning and the format stays 2.1. Four standards come into force by the owner's ruling of 29
# September 2026 (rulings/2026-09-29-four-draft-standards-in-force.yaml, point 1), each in a new
# edition whose first page says so — SDD-03 v1.0, SDD-04 v1.0, SDD-08 v1.0 and SDD-09 v1.2 — and
# rows 02, 04, 05 and 09 name those editions and read in force. `sourced_from` names SDD-01 v3.5, which
# says the same of them. Row 09's `who` gives the person's part, under
# rulings/2026-09-29-what-an-assistant-writes-a-person-approves.yaml: an assistant writes the model,
# and a person reviews it and approves it or asks for adjustments.

# WHAT THE EDITION OF 30 SEPTEMBER 2026 CHANGES (METHOD-2026-09-30-01). No cell changes its
# meaning and the format stays 2.1. The `skill` cell of every row a person writes, and of the
# walk-through the screens' skill produces, names the skill as plugin:skill: the ten skills of the
# method's plugin that the target state (04_TARGET_STATE.md section 2) gives the rows.
# Rows 00 and 10 read absent for good: the method has no skill for the customer's own documents,
# and none for a working application generated from the model. `kit slot --check` gains its third
# new check with them: a named skill must stand under the marketplace's plugins, carry the
# standard of its row in its frontmatter and pin the edition the row names. `kit spec route`
# prints, at each crossing, the skill of the row the crossing gives to.

version: "2.1"
sourced_from: "SDD-01 v3.5 of 29 September 2026, sections 4, 5 and 10"

# THE COUNTS. How many things SDD-01 §4 names, which are the rows of `slots:`, and how many
# handovers SDD-01 §10 numbers, which are the entries of `handovers:`, numbered one to the count.
# `kit slot --check` holds the rows and the entries to these two numbers, and `kit spec map`,
# `kit spec route` and `kit spec new` print them. They are stated here and nowhere else.
counts:
  things: 12
  handovers: 16

# Endpoints of a crossing that are not among the twelve. A handover may name one of these on
# one side; anything else on either side is refused. Figure 6 carries three such crossings.
outside:
  built: The screens as they stand in a built system, read against the record that specified them
  live: A running instance in the hands of the administration that owns it
  world: The work of the people the instance was built for

# Two decisions of the other programme's plan land in this file by citation and are not
# restated in it. They are recorded here so that a reader of this file is not left to
# discover them elsewhere.
#   · one place for each of the three kinds of document, and
#   · the emitted planning commission closing its decisions by the four routes,
# both at round R5 of `_standards/_working/2026-09-14_orchestrator_implementation/`, which
# this round discharges. See `_standards/_working/2026-09-14_improving_the_method/04_PLAN.md`
# section M0, last paragraph.
carried_by_citation:
  - cites: "_standards/_working/2026-09-14_improving_the_method/04_PLAN.md, section M0"
    what: >-
      The two changes round R5 of the orchestrator layer's plan names — one place for each of
      the three kinds of document, and the emitted commission closing decisions by the four
      routes — are discharged by the round that wrote this edition and are not restated here.

slots:

  - n: "00"
    dir: customer_documents
    title: The customer's own documents
    who: The customer
    cadence: [once]
    governs: "Nothing. Not ours to govern."
    when: "Before everything. It is the input the whole method measures against."
    standard:
      absent: >-
        Not ours to govern. SDD-01 §4 names this as the first of the twelve and places it
        outside the set of things this organisation writes.
      owner: the method's owner
    preparation:
      absent: >-
        It is never edited, not even to convert. A text extraction beside it is a derived
        file and not a replacement.
      owner: the method's owner
    seams:
      takes: []
      gives:
        - to: "01"
          what: its sentences, each carried into one entry with the document, the place and the words
          declared_at: "SDD-02 §1, RQR-9"
          handover: 1
        - to: "02"
          what: one module's written descriptions
          declared_at: "SDD-03 §1; EM-46 to EM-51"
          handover: 2
    check:
      absent: >-
        The check is the receiving side's. A request that reaches nothing in the customer's
        material is a finding raised there, not a conformance check of this thing.
      owner: the method's owner
    skill:
      absent: >-
        No skill of the method, and none is to be written: the target state
        (04_TARGET_STATE.md section 2) gives this thing none, the round of
        30 September 2026 (METHOD-2026-09-30-01) recorded that here, and
        `kit slot --check` reports the cell on every use.
      owner: the method's owner
    notes: |
      **It is never edited.** Not to fix a typo, not to renumber, not to convert. A text
      extraction may be generated beside it and is a derived file, not a replacement.

      Everything in every slot above this one is measured against what is here, and never
      the other way round.

  - n: "01"
    dir: requirements_register
    title: The register of requirements
    who: "An assistant extracts it; the analyst rules on it"
    cadence: [once]
    governs: "`SDD-02` · RQR-3 to RQR-29 · **draft**"
    when: >-
      Once for the whole system, before the entity model and the use case model, because it
      is one of the two things that measure them.
    standard:
      code: SDD-02
      file: SDD-02_The_Requirements_Catalogue_v0.3.md
      edition: "0.3"
      standing: draft
      rules: RQR-3 to RQR-29
    preparation:
      form: "§6 the record sheet for one entry; §7 the record sheet for the register as a whole"
      template: templates/spec/artefacts/01_requirements_register.md
    seams:
      takes:
        - from: "00"
          what: the customer's sentences, each with its source line
          declared_at: "SDD-02 §1, RQR-3, RQR-8, RQR-9"
          handover: 1
          how:
            stated: "SDD-02 §1.3 where the register sits in the work; §4.1 completeness measured against the client's material; §6 the record sheet filled once for each entry"
      gives:
        - to: "03"
          what: the stated requirements, bound in both directions to the goals
          declared_at: "SDD-02 RQR-27 to RQR-29; SDD-05 M16"
          handover: 3
        - to: "04"
          what: itself, read and its version recorded
          declared_at: "SDD-08 §7.1"
    check:
      gate: "§8, checking the work"
      checklist: templates/spec/checklists/SDD-02.md
      program: none
      conformance: "§11, how to say that you have followed this document — rule by rule, RQR-3 to RQR-29"
    skill: sdd-kit:requirements-catalogue
    notes: |
      This register is one of the two measures the method rests on, and `SDD-01` §3 gives
      the reason: *if the list of things that must be covered is drawn up from the design
      itself, then measuring the design against it will always show that the design is
      complete.* It is written by a separate act, before the design exists.

      **Not one of `SDD-02`'s twenty-five rules cleared this organisation's evidence bar** —
      its §12 says so on its face, and the standard's own first page repeats it. Expect this
      slot to produce amendments.

      Closed 22 September 2026 by clauses 3a and 3b of 03_ADDITIONS.md: SDD-02 v0.2 RQR-27
      names the use case model and its standard (SDD-05) as the reader of the published
      list, and SDD-05 v2.1 M16 names the register as published under SDD-02 RQR-27 as the
      list a goal binds to. The person standing at it is unchanged: the model's owner at the
      review (SDD-05 §11).

  - n: "02"
    dir: entity_model
    title: The entity model, its glossary and its register of business rules
    who: The analyst
    cadence: [once, alongside]
    governs: "`SDD-03` · EM-1 to EM-56 · **in force**"
    when: >-
      In two passes. The first pass is written BEFORE the use case model, so that it can
      measure it. The second is deepened alongside, as the goals demand detail.
    standard:
      code: SDD-03
      file: SDD-03_The_Entity_Model_v1.0.md
      edition: "1.0"
      standing: in force
      rules: EM-1 to EM-56
    preparation:
      form: "§5, the form the analyst fills, in five parts, answered in two passes, the form itself saying which lines belong to the first (EM-56)"
      template: templates/spec/artefacts/02_entity_model.md
      beside:
        - templates/spec/artefacts/02_glossary.md
        - templates/spec/artefacts/02_business_rules.md
    seams:
      takes:
        - from: "00"
          what: one module's written descriptions
          declared_at: "SDD-03 §1; EM-46 to EM-51"
          handover: 2
          how:
            stated: "SDD-03 §5, how the records are found in the module's written descriptions: the four tests of EM-11 put to each thing they name, and the words that named it kept as its source line (EM-50)"
        - from: "05"
          what: the name of every setting a rule reads, and no value of it
          declared_at: "SDD-03 EM-42; SDD-04 §4"
          how:
            stated: "SDD-04 §5.6, the form filled once for each setting; SDD-03 EM-42"
      gives:
        - to: "03"
          what: the one word for every thing, the glossary, and the register of business rules
          declared_at: "SDD-05 M17, M18, M22"
        - to: "05"
          what: the classification, issuer, publication and source line of every governed list
          declared_at: "SDD-03 EM-46 to EM-51; SDD-04 IOS-28, IOS-31, IOS-32"
        - to: "06"
          what: the word the goal must use for every thing the system keeps a record of
          declared_at: "SDD-06 U10, U11, U20"
        - to: "07"
          what: for every value whether this system is its authority, consumes it, or must not hold it
          declared_at: "SDD-03 EM-19, EM-21; SDD-07 §6"
          handover: 8
        - to: "09"
          what: the domain model, in the platform reference's word
          declared_at: "SDD-09 §11, in S2C-01's vocabulary"
    check:
      gate: "§6, the quality check which is also the review gate — 6.1 what a program will refuse, C1 to C43, 6.2 what only a person can judge, 6.3 the gate"
      checklist: templates/spec/checklists/SDD-03.md
      program: none
      conformance: "§11, rule by rule, EM-1 to EM-56"
    skill: sdd-kit:entity-model
    notes: |
      `SDD-03`'s §5 is the centre of the standard and not an appendix: a form in five parts,
      answered in two passes, and **a model is finished for a pass when every line of that
      pass has an answer or a written reason for having none** (EM-56).

      Adding detail in the second pass is allowed at any time. **Changing what the first
      pass already said is a different act** and travels as a correction.

      **The four findings the inception round raised against this standard, as they stand
      today.** F-1, that the superseded version 0.4 stood in the root beside version 0.5, is
      repaired: version 0.4 is in `x_archive/2026-09-15-superseded-by-the-rebuild/` and the
      root holds one edition. F-4, that the root readme named version 0.4 and gave the rules
      as EM-1 to EM-51, is repaired: the readme names version 0.5 and EM-1 to EM-56. F-2,
      that the edition of record had no build source anywhere in the estate, is answered:
      `_working/2026-09-15_the_rebuild/build/settings/SDD-03_v0_5.json` exists. F-3, that
      the edition was written into the root with nothing recording it, stands as a fact
      about how that edition arrived and cannot be repaired after the event.

      **The crossing from the customer's descriptions into the first pass was the one place
      in the method where a standard named the input, gave the form, and did not say what
      to do.** Handover 2. Since `SDD-03` v0.6 the sentence at the head of its §5 says it,
      and the cell above points there.

  - n: "03"
    dir: use_case_model
    title: The use case model
    who: One named architect
    cadence: [once]
    governs: "`SDD-05` · M1 to M22 · **in force**"
    when: >-
      Once for the whole system, after the register of requirements and after the first pass
      of the entity model.
    standard:
      code: SDD-05
      file: SDD-05_The_Use_Case_Model_v2.1.md
      edition: "2.1"
      standing: in force
      rules: M1 to M22
    preparation:
      form: "§9 the model record, with §9.1 fixing the ten header fields; §13 a worked model"
      template: templates/spec/artefacts/03_use_case_model.md
    seams:
      takes:
        - from: "01"
          what: the stated requirements, bound in both directions to the goals
          declared_at: "SDD-02 RQR-27 to RQR-29; SDD-05 M16"
          handover: 3
          how:
            stated: "SDD-05 M7 for every actor ask what goals; M8 naming them; M9 granularity by three tests; M10 refusing decomposition; M14 and M16 the two completeness conditions; §9.1 the header the binding is carried on"
        - from: "02"
          what: the one word for every thing, and the glossary for the rest
          declared_at: "SDD-05 M17, M18, M22"
          how:
            stated: "SDD-05 M17 name exactly one entity model; M22 the glossary carries the rest"
        - from: "03"
          what: the goals checked against one another, from the survey generated out of their own headers
          declared_at: "SDD-05 M13, M14, M19"
          handover: 5
          how:
            stated: "SDD-05 M13 generate the survey from the use cases' record headers; M19 hold the model as versioned text; M14 the conditions read from it"
      gives:
        - to: "06"
          what: one row of the survey, the boundary, and the catalogue of actors
          declared_at: "SDD-06 §1, §3, U1"
        - to: "04"
          what: itself, read and its version recorded
          declared_at: "SDD-08 §7.1"
    check:
      gate: "§11, the review"
      checklist: templates/spec/checklists/SDD-05.md
      program: none
      conformance: "§1, *Claiming conformance* — rule by rule, M1 to M22"
    skill: sdd-kit:use-case-model
    notes: |
      One boundary, the people outside it, every goal they need, and how those goals group
      together. There is one per system.

      `SDD-01` §5 gives the reason it comes before the descriptions: *without a document
      that says how many goals there are, a team writes out the goals it happens to think
      of.*

      **The standard expects a program here and none exists.** M19 says that holding the
      model as versioned text with the survey generated makes the conditions of M14 to M16
      *checkable automatically*, and no program in the kit generates or reads that survey.
      Handover 5 holds on a person.

  - n: "04"
    dir: architecture
    title: The software architecture specification
    who: The solution architect
    cadence: [alongside]
    governs: "`SDD-08` · ARC-1 to ARC-31 · **in force**"
    when: >-
      Alongside everything, to the end, and finished before the application model is begun.
      It does not feed the entity model or the use cases and is not fed by them.
    standard:
      code: SDD-08
      file: SDD-08_The_Software_Architecture_Document_v1.0.md
      edition: "1.0"
      standing: in force
      rules: ARC-1 to ARC-31
    preparation:
      form: "§7, the form the architect fills, in six parts"
      template: templates/spec/artefacts/04_architecture.md
    seams:
      takes:
        - from: "01"
          what: the register of requirements, read and its version recorded
          declared_at: "SDD-08 §7.1"
          how:
            stated: "SDD-08 §7.1, the documents read with the version of each; §10 what it cites and never restates"
        - from: "03"
          what: the use case model, read and its version recorded
          declared_at: "SDD-08 §7.1"
          how:
            stated: "SDD-08 §7.1, the documents read with the version of each"
        - from: "02"
          what: the record model, read and its version recorded, whose states every process must already carry
          declared_at: "SDD-08 §7.1, §7.3, ARC-15"
          how:
            stated: "SDD-08 §7.3, part 3 filled once for each process, whose states must already stand in the record model (ARC-15)"
      gives:
        - to: "09"
          what: what the application is built on
          declared_at: "SDD-08 §1.4, §4"
    check:
      gate: "§8, the review gate — 8.1 what a program can check, of which none has been built, 8.2 what only a person can judge"
      checklist: templates/spec/checklists/SDD-08.md
      program: none
      conformance: "§12, rule by rule, ARC-1 to ARC-31"
    skill: sdd-kit:architecture-document
    notes: |
      What the application is built on: the platform binding, the components it switches
      on, the machinery that runs its processes, what crosses its boundaries, and the
      bespoke-code budget.

      **Nothing that refuses in `SDD-08` rests on published practice.** Every refusal in it
      is this organisation's own, and §13 says where the rules come from.

      **`SDD-08` assigns this slot to a solution architect.** If nobody holds that role on
      this system, that is a decision for the owner before the slot opens, not a gap to
      work around.

      **Where the list of processes comes from is not stated.** §7.3 is filled once for each
      process and the form assumes the list; no document says which artefact publishes it.

  - n: "05"
    dir: shared_groundwork
    title: The rest of the shared groundwork
    who: "A person, assisted"
    cadence: [once]
    governs: "`SDD-04` · IOS-1 to IOS-47 · **in force**"
    when: >-
      Below the four things settled once, and before any goal is written out — because a
      goal draws on it and may not invent what it does not find.
    standard:
      code: SDD-04
      file: SDD-04_The_Shared_Registers_v1.0.md
      edition: "1.0"
      standing: in force
      rules: IOS-1 to IOS-47
    preparation:
      form: "§5, the form the analyst fills in seven parts — §5.6 once for each setting, §5.7 once for each class of change"
      template: templates/spec/artefacts/05_shared_registers.md
    seams:
      takes:
        - from: "02"
          what: the classification, issuer, publication and source line of every governed list
          declared_at: "SDD-04 IOS-28, IOS-31, IOS-32; SDD-03 EM-46 to EM-51"
          how:
            stated: "SDD-04 §5.5, the form filled once for each governed list and once for each named selection of one; IOS-28, IOS-31 and IOS-32 cite the entity model's own row rather than restating it"
      gives:
        - to: "02"
          what: the catalogue of settings by name, and no value
          declared_at: "SDD-03 EM-42; SDD-04 §4"
        - to: "06"
          what: the records, events, computations, code lists and settings a goal may cite, by identifier
          declared_at: "SDD-04 IOS-15 to IOS-18; SDD-06 U19 to U21, §8.1"
          handover: 4
        - to: "09"
          what: what each register content owes the application model
          declared_at: "SDD-04 §10"
    check:
      gate: "§6, the review gate in two halves, of which none runs yet"
      checklist: templates/spec/checklists/SDD-04.md
      program: none
      conformance: "§11, rule by rule, IOS-1 to IOS-47"
    skill: sdd-kit:shared-registers
    notes: |
      **Its first subject is identity, ownership and state** — what makes two rows the same
      thing, who writes each fact, and the states a record moves through, which are the
      families A to D of `SDD-04` and parts 1 and 2 of its form. The other four are the
      catalogues of events, of computations, of shared code lists and of settings.

      Everything a goal draws on but does not own, other than the records themselves: who
      owns each fact, what states a record moves through, what makes two rows the same
      thing, and the four catalogues beside them — events, computations, the code lists a
      value may point at, and the settings the administration may change.

      **Twenty-nine of `SDD-04`'s forty-seven rules cleared this organisation's evidence bar
      and eighteen did not**, and seven of the twenty-nine cleared at a weaker shape than the
      rule states. §9 gives the tally for each edition's rules separately.

      A goal that needs a record, an event, a computation or a screen pattern this
      groundwork does not have **may not invent one.** It raises a finding with an owner.
      `SDD-01` §14 calls this the most important rule of all when an assistant is doing the
      writing, *because inventing something plausible is the thing an assistant does best.*

      **The one subject of this slot that `SDD-04` does not take is the vocabulary a screen
      may be built from**, which is governed where it always belonged, by the enterprise

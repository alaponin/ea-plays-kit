  # The receiving side of 16 is declared by the kit, not by a standard: the schema's entry
  # model.interaction_design, required, and rule L021 of tools/validate.py, which refuses the model
  # in kit validate, kit gen, the build and the deploy. SDD-09, the standard of the model, names
  # neither until its version 1.2 (the plan of the step, its point 3), so the two sides do not
  # yet name each other.
  - h: 16
    from: "08a"
    to: "09"
    crosses: the accepted interaction design, which the model names by its path and its checksum
    condition: >-
      the model names the document the owner accepted by its path and SHA-256 checksum, and the
      kit refuses — in every custody mode, with nothing to turn it off — a model that names none,

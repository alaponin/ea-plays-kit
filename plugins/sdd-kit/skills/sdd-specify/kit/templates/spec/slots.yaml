    to: "03"
    crosses: the stated requirements, bound in both directions to the goals
    condition: >-
      every stated requirement is realised by at least one goal and every goal realises at
      least one stated requirement (SDD-05 M16); the list bound to is the register's
      published list (SDD-02 RQR-27)
    declared_by:
      giving: "SDD-02 RQR-27 to RQR-29"
      receiving: "SDD-05 M16"
    names_each_other: true
    stands_at: person
    state: holds
    closes_with: ""


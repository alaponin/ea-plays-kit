# ---------------------------------------------------------------------------------------
# The sixteen crossings of SDD-01 §4 and §10, figure 6 — as many as `counts.handovers` states.
#
# `from` and `to` are a slot number of this file or an endpoint declared under `outside:`
# above; anything else is refused. `declared_by` gives the two sides' own declarations, and
# every section and rule it names must stand in the edition of record the slot row cites.
# `closes_with` names the clause of `03_ADDITIONS.md` that closes a break; when the clause
# lands, the field is emptied and `state` becomes `holds`.
#
# A handover's `how` is not carried here. It is the `how` of the one seam entry of a slot row
# that carries the handover's number, and `kit slot --check` refuses a handover whose number
# no seam entry carries, and a number carried by more than one. The entry and the handover
# must agree on their ends: a `takes` entry on slot X carrying handover h has h.to equal to X
# and h.from equal to the entry's `from`; a `gives` entry on slot X carrying handover h has
# h.to equal to the entry's `to`, and h.from equal to X or an endpoint declared under
# `outside:`. Thirteen of the sixteen are carried by a `takes` entry; the three whose receiving
# end is not one of the twelve — 10, 13 and 14 — are carried by the `gives` entry of the slot
# that reaches that end, because the register has no other entry for them.
#
# The verdicts below are the seams round's, at
# `_standards/_working/2026-09-15_the_seams/00_WHAT_IS_WRITTEN.md` sections 2 and 6, and the
# states are `02_SCHEMA.md` section 3's. They are copied here and not re-derived.
#
# EXCEPT rows 3, 4, 7, 10 and 11, which were brought on 22 September 2026, by the round carrying
# out METHOD-2026-09-22-07, to what the standards say after it amended them: SDD-02 v0.2,
# SDD-04 v0.4, SDD-05 v2.1, SDD-06 v1.1 and SDD-07 v1.1. The comment above each of those rows
# says what closed it, or what stands in the way. The round's report is
# `_standards/_working/2026-09-22_the_crossings_closed/`.
# ---------------------------------------------------------------------------------------


# Where each thing the model of the lending desk is written from landed. A fixture of the method's
# application-model skill: the lending desk of the library of a town called Eastbrook, which does
# not exist; it belongs to no engagement. `row` is the first cell of the landing table's row, in the
# words `scripts/landing.py tables` prints; `ref` is where the thing landed in the model; an
# assumption is the decision in one sentence, with its ground. What the interaction design decides
# is not repeated here: the kit's gate compares the model with it, row by row.
model: lending_desk.app.yaml
loss_report: loss-report.yaml

items:
# --- the use case Lend an item to a member, ../06_use_cases/UC-LD-01.md
